<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 聊天</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #232734;
    --text: #e6e8ee;
    --muted: #8b90a0;
    --accent: #6c5ce7;
    --border: #2a2f3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--accent); }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; gap: 12px; max-width: 80%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--card2); border-bottom-left-radius: 4px; }
  .typing { color: var(--muted); font-size: 13px; }
  .input-bar {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    align-items: flex-end;
  }
  .input-bar textarea {
    flex: 1;
    resize: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    max-height: 150px;
    outline: none;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 15px;
    cursor: pointer;
  }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>AI 聊天</h1>
    <a href="/">← 返回像素画工具</a>
  </header>
  <div id="messages" class="messages">
    <div class="msg assistant"><div class="bubble">你好！我是 AI 助手，有什么可以帮你？</div></div>
  </div>
  <div class="input-bar">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
    <button id="send">发送</button>
  </div>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  inputEl.value = '';
  autoResize();

  addBubble('user', text);
  history.push({ role: 'user', content: text });

  sendBtn.disabled = true;
  const bubble = addBubble('assistant', '');
  bubble.innerHTML = '<span class="typing">思考中...</span>';

  let full = '';
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error('HTTP ' + resp.status + ': ' + errText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstChunk = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
          if (delta) {
            if (firstChunk) { bubble.textContent = ''; firstChunk = false; }
            full += delta;
            bubble.textContent = full;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (e) { /* 忽略单行解析错误 */ }
      }
    }

    if (!full) bubble.textContent = '（无回复）';
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    bubble.textContent = '请求失败：' + err.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
}

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);
</script>
</body>
</html>
