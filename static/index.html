<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片转像素画</title>
  <style>
    :root {
      --bg: #14121f;
      --card: #1e1b2e;
      --card2: #282440;
      --accent: #7c5cff;
      --accent2: #5eead4;
      --text: #eceaf6;
      --muted: #9b96b3;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #2a2145 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 20px;
    }
    .dropzone {
      border: 2px dashed rgba(124,92,255,.4);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      color: var(--muted);
    }
    .dropzone:hover, .dropzone.drag {
      border-color: var(--accent);
      background: rgba(124,92,255,.08);
      color: var(--text);
    }
    .dropzone img { max-width: 100%; max-height: 220px; border-radius: 8px; }
    .dropzone .placeholder { font-size: 40px; margin-bottom: 8px; }
    .field { margin-top: 18px; }
    .field label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .field label b { color: var(--accent2); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="range"]:disabled { opacity: .4; cursor: not-allowed; }
    .seg { display: flex; background: var(--card2); border-radius: 10px; padding: 4px; gap: 4px; }
    .seg-item { flex: 1; text-align: center; cursor: pointer; }
    .seg-item input { display: none; }
    .seg-item span { display: block; padding: 8px 0; border-radius: 8px; font-size: 14px; color: var(--muted); transition: .2s; }
    .seg-item input:checked + span { background: var(--accent); color: #fff; }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }
    .btn-primary { background: linear-gradient(90deg, var(--accent), #9b6bff); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost { background: var(--card2); color: var(--text); }
    .result-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .result-panel .placeholder { color: var(--muted); text-align: center; }
    .result-panel img {
      max-width: 100%;
      image-rendering: pixelated;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .status { margin-top: 16px; min-height: 20px; text-align: center; font-size: 14px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--accent2); }
    .spinner {
      display: none;
      width: 22px; height: 22px;
      border: 3px solid rgba(124,92,255,.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>图片转像素画</h1>
    <p class="subtitle">上传一张图片，自定义像素块大小与颜色数量</p>

    <div class="grid">
      <div class="panel">
        <div class="dropzone" id="dropzone">
          <div id="dropPlaceholder">
            <div class="placeholder">🖼️</div>
            点击选择或拖拽图片到这里
          </div>
          <img id="preview" class="hidden" alt="预览" />
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden" />

        <div class="field">
          <label>尺寸模式</label>
          <div class="seg">
            <label class="seg-item">
              <input type="radio" name="dimMode" value="size" checked />
              <span>像素块大小</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="dimMode" value="width" />
              <span>宽度像素数</span>
            </label>
          </div>
        </div>

        <div class="field" id="fieldSize">
          <label>像素块大小 <b><span id="sizeVal">12</span> px</b></label>
          <input type="range" id="size" min="2" max="64" value="12" step="1" />
        </div>
        <div class="field hidden" id="fieldWidth">
          <label>宽度像素块数 <b><span id="widthVal">128</span> 块</b></label>
          <input type="range" id="widthBlocks" min="16" max="512" value="128" step="1" />
          <div style="font-size:12px;color:var(--muted)">指定输出宽度有多少个像素块，自动计算块大小</div>
        </div>
        <div class="field">
          <label>调色板颜色数量 <b><span id="colorsVal">32</span> 色</b></label>
          <input type="range" id="colors" min="0" max="256" value="32" step="1" />
          <div style="font-size:12px;color:var(--muted)">0 表示不量化（保留平均色）</div>
        </div>

        <div class="actions">
          <button class="btn-primary" id="btnConvert">生成像素画</button>
          <button class="btn-ghost" id="btnReset">重置</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel result-panel">
        <div id="resultPlaceholder">
          <div class="placeholder">🎨<br />结果将显示在这里</div>
        </div>
        <div class="spinner" id="spinner"></div>
        <img id="result" class="hidden" alt="像素画结果" />
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const resultPlaceholder = document.getElementById('resultPlaceholder');
    const statusEl = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const btnConvert = document.getElementById('btnConvert');

    const sizeInput = document.getElementById('size');
    const widthInput = document.getElementById('widthBlocks');
    const colorsInput = document.getElementById('colors');
    const sizeVal = document.getElementById('sizeVal');
    const widthVal = document.getElementById('widthVal');
    const colorsVal = document.getElementById('colorsVal');
    const fieldSize = document.getElementById('fieldSize');
    const fieldWidth = document.getElementById('fieldWidth');

    let selectedFile = null;

    sizeInput.addEventListener('input', () => sizeVal.textContent = sizeInput.value);
    widthInput.addEventListener('input', () => widthVal.textContent = widthInput.value);
    colorsInput.addEventListener('input', () => colorsVal.textContent = colorsInput.value);

    // 尺寸模式二选一：切换时禁用/启用对应滑块
    document.querySelectorAll('input[name="dimMode"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isSize = radio.value === 'size' && radio.checked;
        sizeInput.disabled = !isSize;
        widthInput.disabled = isSize;
        fieldSize.classList.toggle('hidden', !isSize);
        fieldWidth.classList.toggle('hidden', isSize);
      });
    });

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
      e.preventDefault(); dropzone.classList.add('drag');
    }));
    ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
      e.preventDefault(); dropzone.classList.remove('drag');
    }));
    dropzone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        setStatus('请选择图片文件', 'error');
        return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.classList.remove('hidden');
        document.getElementById('dropPlaceholder').classList.add('hidden');
      };
      reader.readAsDataURL(file);
      setStatus('已选择：' + file.name);
    }

    document.getElementById('btnReset').addEventListener('click', () => {
      selectedFile = null;
      preview.classList.add('hidden');
      result.classList.add('hidden');
      resultPlaceholder.classList.remove('hidden');
      document.getElementById('dropPlaceholder').classList.remove('hidden');
      fileInput.value = '';
      setStatus('');
    });

    btnConvert.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('请先选择一张图片', 'error');
        return;
      }
      const formData = new FormData();
      formData.append('image', selectedFile);
      formData.append('colors', colorsInput.value);

      // 二选一：按块大小传 size，按宽度传 width_blocks
      const mode = document.querySelector('input[name="dimMode"]:checked').value;
      if (mode === 'width') {
        formData.append('width_blocks', widthInput.value);
      } else {
        formData.append('size', sizeInput.value);
      }

      btnConvert.disabled = true;
      spinner.style.display = 'block';
      setStatus('生成中，请稍候...');

      try {
        const resp = await fetch('/api/pixelate', { method: 'POST', body: formData });
        if (!resp.ok) {
          const msg = await resp.text();
          throw new Error(msg || resp.statusText);
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        result.src = url;
        result.classList.remove('hidden');
        resultPlaceholder.classList.add('hidden');
        setStatus('生成成功！右键图片可另存为，或点击下方下载', 'ok');
      } catch (err) {
        setStatus('生成失败：' + err.message, 'error');
      } finally {
        btnConvert.disabled = false;
        spinner.style.display = 'none';
      }
    });

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }
  </script>
</body>
</html>
